name: CI

# This repository's own checks: the unit tests in tests/, actionlint over the
# workflows, and on a pull request the quality scan, from this checkout. The other
# workflows here are reusable ones, for callers.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the oldest Python the scripts support
      - run: pip install -q pytest && python -m pytest -q

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o actionlint.tar.gz "$url"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c --quiet -
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color

  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/quality-scan
        with:
          base: ${{ github.base_ref }}
