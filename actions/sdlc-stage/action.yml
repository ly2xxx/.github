name: SDLC Stage
description: One step of the SDLC pipeline - Ollama Cloud writes intent, spec and plan, a builder (Claude Code or a person) builds it, then checks, an Ollama review and the pull request.
author: ly2xxx

# Commands (see sdlc_stage.py):
#   resolve  pick the feature folder, its feature/<name> branch and the first stage
#   stage    write intent.md, spec.md or plan.md and push it to the feature branch
#   freeze   tag the approved documents as sdlc/<feature>/approved and hand the
#            plan to the builder (step 4)
#   wait     step 4's pause: poll until build-log.md logs every phase
#   verify   check the built branch against the approved plan's phases (scope,
#            frozen files, unchanged documents, each phase's Verify commands, the
#            whole test suite); with a phase and a base, one phase branch
#   review   Ollama reviews the diff against the approved spec (advisory)
#   pr       open or update the pull request, as a draft if verification failed
# The workflow can pause for a person between stages with a GitHub environment
# that has required reviewers; the action itself never waits.

inputs:
  command:
    description: resolve, stage, freeze, wait, verify, review or pr.
    required: true
  stage:
    description: For command stage - intent, spec or plan.
    required: false
    default: ""
  idea:
    description: One line. Drafts intent.md for a new feature, or revises the named feature's intent.
    required: false
    default: ""
  issue-body:
    description: "For resolve - the body of the issue that started the run. A line like \"feature: 001-name\" revises that feature."
    required: false
    default: ""
  merged-phase:
    description: For resolve - the head branch (phase/<feature>/<n>) of a merged pull request, used when idea and feature are empty. Starts the build run once build-log.md logs every phase.
    required: false
    default: ""
  feature:
    description: Folder under features-dir.
    required: false
    default: ""
  phase:
    description: For verify - check only this phase (with base, the phase branch's changes).
    required: false
    default: ""
  builder:
    description: For freeze - who builds the plan, claude or human. A label in the hand-off and the tag; the instructions are the same.
    required: false
    default: claude
  build-wait-minutes:
    description: For freeze and wait - how long step 4 waits for the build before the run stops. 0 = don't wait.
    required: false
    default: "0"
  start:
    description: For resolve - auto, intent, spec, plan or build.
    required: false
    default: auto
  base:
    description: The branch the feature (or, for verify with a phase, the phase) goes into. New feature branches start from it.
    required: false
    default: ""
  features-dir:
    description: Where feature folders live.
    required: false
    default: sdlc/features
  model:
    description: Ollama Cloud model for intent, spec, plan and review.
    required: false
    default: deepseek-v4-flash:cloud
  ollama-api-key:
    description: Ollama Cloud API key (commands stage and review).
    required: false
    default: ""
  think:
    description: Thinking for reasoning models - true, false, low, medium or high. Empty leaves the model's default.
    required: false
    default: ""
  timeout-seconds:
    description: Longest one model answer may take, streamed.
    required: false
    default: "1200"
  max-context-chars:
    description: Budget for repository files included in a prompt.
    required: false
    default: "60000"
  test-command:
    description: For verify - the whole test suite. The plan stage is also told it, when given.
    required: false
    default: ""
  report:
    description: For verify, review and pr - path of the verification report (for review, of the review).
    required: false
    default: ""
  review:
    description: For pr - path of the Ollama review to add to the pull request.
    required: false
    default: ""
  github-token:
    description: For pr - token that opens the pull request.
    required: false
    default: ""

outputs:
  feature:
    description: resolve - the feature folder.
    value: ${{ steps.run.outputs.feature }}
  base:
    description: resolve - the branch the feature goes into, as given.
    value: ${{ steps.run.outputs.base }}
  branch:
    description: resolve - the feature branch.
    value: ${{ steps.run.outputs.branch }}
  start:
    description: resolve - the first stage that runs.
    value: ${{ steps.run.outputs.start }}
  intent:
    description: resolve - whether the intent stage runs.
    value: ${{ steps.run.outputs.intent }}
  spec:
    description: resolve - whether the spec stage runs.
    value: ${{ steps.run.outputs.spec }}
  plan:
    description: resolve - whether the plan stage runs.
    value: ${{ steps.run.outputs.plan }}
  passed:
    description: verify - true when every check passed.
    value: ${{ steps.run.outputs.passed }}
  built:
    description: wait - true when build-log.md logs every phase.
    value: ${{ steps.run.outputs.built }}
  tag:
    description: freeze - the tag on the approved documents.
    value: ${{ steps.run.outputs.tag }}
  design:
    description: resolve - true when this run writes documents, false when it verifies a build.
    value: ${{ steps.run.outputs.design }}
  mode:
    description: resolve - design (write documents, hand off), build (verify, review, pull request) or none.
    value: ${{ steps.run.outputs.mode }}
  pr:
    description: pr - URL of the pull request.
    value: ${{ steps.run.outputs.pr }}

runs:
  using: composite
  steps:
    - name: Run
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        STAGE: ${{ inputs.stage }}
        SDLC_IDEA: ${{ inputs.idea }}
        SDLC_FEATURE: ${{ inputs.feature }}
        SDLC_MERGED_PHASE: ${{ inputs.merged-phase }}
        SDLC_ISSUE_BODY: ${{ inputs.issue-body }}
        SDLC_START: ${{ inputs.start }}
        SDLC_PHASE: ${{ inputs.phase }}
        SDLC_BUILDER: ${{ inputs.builder }}
        BUILD_WAIT_MINUTES: ${{ inputs.build-wait-minutes }}
        BASE_REF: ${{ inputs.base }}
        FEATURES_DIR: ${{ inputs.features-dir }}
        OLLAMA_MODEL: ${{ inputs.model }}
        OLLAMA_API_KEY: ${{ inputs.ollama-api-key }}
        OLLAMA_THINK: ${{ inputs.think }}
        OLLAMA_TIMEOUT: ${{ inputs.timeout-seconds }}
        MAX_CONTEXT_CHARS: ${{ inputs.max-context-chars }}
        TEST_COMMAND: ${{ inputs.test-command }}
        REPORT: ${{ inputs.report }}
        REVIEW: ${{ inputs.review }}
        GH_TOKEN: ${{ inputs.github-token }}
        ACTOR: ${{ github.actor }}
        PYTHONUNBUFFERED: "1"
        GIT_TERMINAL_PROMPT: "0"
      run: |
        script="$GITHUB_ACTION_PATH/sdlc_stage.py"
        case "$COMMAND" in
          resolve) python3 "$script" resolve ;;
          stage)
            if [ -z "$OLLAMA_API_KEY" ]; then echo "::error::The stage command needs ollama-api-key."; exit 1; fi
            python3 "$script" stage "$STAGE" ;;
          freeze) python3 "$script" freeze ;;
          wait) python3 "$script" wait ;;
          verify) python3 "$script" verify ${SDLC_PHASE:+--phase "$SDLC_PHASE"} ${REPORT:+--report "$REPORT"} ;;
          review)
            if [ -z "$OLLAMA_API_KEY" ]; then echo "::error::The review command needs ollama-api-key."; exit 1; fi
            python3 "$script" review ${REPORT:+--report "$REPORT"} ;;
          pr) python3 "$script" pr ${REPORT:+--report "$REPORT"} ${REVIEW:+--review "$REVIEW"} ;;
          *) echo "::error::command must be resolve, stage, freeze, wait, verify, review or pr"; exit 1 ;;
        esac
